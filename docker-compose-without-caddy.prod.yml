version: "3.9"

services:
  # ----------------------------------------
  # Express Backend
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: livequiz-backend-prod

    init: true

    ports:
      - "8000:8000"

    environment:
      PORT: 8000
      NODE_ENV: production

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}

      MONGO_URI: ${MONGO_URI}

      REDIS_URI: ${REDIS_URI}

      FRONTEND_URL: ${FRONTEND_URL}

      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-"Live Quiz" <no-reply@livequiz.com>}

    networks:
      - livequiz-network

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  livequiz-network:
    driver: bridge
